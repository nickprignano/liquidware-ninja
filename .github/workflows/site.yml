name: site

# Validates the static site (site/, published to https://liquidware-ninja.prignano.ai/ via Cloudflare
# Workers Static Assets) and deploys when CLOUDFLARE_API_TOKEN is configured.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - 'docs/knowledge/**'
      - 'blog/**'
      - 'llms.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'tests/site.test.mjs'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - 'docs/knowledge/**'
      - 'blog/**'
      - 'llms.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'tests/site.test.mjs'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Validate & Deploy Site to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify site build and run site tests
        run: |
          npm run check:site
          npm test

      - name: Deploy via Wrangler (on main when CLOUDFLARE_API_TOKEN is set)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN secret not set in GitHub Actions; skipping CLI deploy (Cloudflare Git integration or local npm run cf:deploy handles deployment)."
          fi
