name: tools

on:
  push:
    branches: [main]
    paths:
      - 'scripts/tools/**'
      - 'templates/**'
      - 'tests/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/tools.yml'
  pull_request:
    paths:
      - 'scripts/tools/**'
      - 'templates/**'
      - 'tests/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/tools.yml'

permissions:
  contents: read

jobs:
  pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.6.0 -Scope CurrentUser -Force -SkipPublisherCheck
          foreach ($p in 'scripts/tools', 'tests') { Invoke-ScriptAnalyzer -Path $p -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit }
          Invoke-Pester -Path ./tests -CI
