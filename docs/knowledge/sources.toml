# Sources the KB curator watches. See docs/knowledge/curation.md.
# Add a source by appending a table below; no code change needed.
#
# kinds:
#   github_releases  new releases of a repo
#   github_commits   new commits on a repo's default branch (for repos that rarely tag releases);
#                    add path = "..." to watch only one file or folder
#   github_org_repos new or recently pushed repos in an org
#   github_user_repos the same for a person's account (user = "..."); add keywords to narrow it
#   github_issues    issues and PRs opened or updated in a repo
#   github_search    new repositories matching a search query (prior art)
#   feed             RSS/Atom feed, optionally filtered by keywords
#   zendesk          a Zendesk help center's recently updated articles
#
# keywords narrows any kind to items whose title or text mentions one of them.
# Blog feeds are added only after a curator run confirms they work (curation.md).

# --- Liquidware ---------------------------------------------------------------

[[source]]
name = "Liquidware support center"
kind = "zendesk"
url = "https://support.liquidware.com"
# Liquidware's release notes, hot fix lists and knowledge articles for every product.
keywords = ["Stratusphere", "Connector ID", "ProfileUnity", "FlexApp", "CommandCTRL", "Release", "Azure"]
kb_page = "liquidware/products.md"

[[source]]
name = "Liquidware news and blog"
kind = "feed"
url = "https://www.liquidware.com/rss.xml"
keywords = ["Stratusphere", "ProfileUnity", "FlexApp", "CommandCTRL", "Azure", "AVD", "Virtual Desktop"]
expert = "liquidware-blog"
kb_page = "liquidware/products.md"

[[source]]
name = "Liquidware Labs: Stratusphere UX samples (no license, reference only)"
kind = "github_commits"
repo = "liquidwarelabs/Stratusphere-UX"
kb_page = "liquidware/community-projects.md"

[[source]]
name = "Liquidware Labs: new and updated repos"
kind = "github_org_repos"
org = "liquidwarelabs"
kb_page = "liquidware/community-projects.md"

[[source]]
name = "GitHub: new Stratusphere repos (prior art)"
kind = "github_search"
query = "stratusphere"
kb_page = "liquidware/community-projects.md"

[[source]]
name = "GitHub: new ProfileUnity and FlexApp repos (prior art)"
kind = "github_search"
query = "profileunity OR flexapp"
kb_page = "liquidware/community-projects.md"

