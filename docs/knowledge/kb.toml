# This KB's identity: the only settings that differ between KBs that share the family scripts.
# build.py writes llms.txt and orders topics from it; sources.py sends user_agent to the APIs it calls.
# Keep topic_order in step with the topic list in schema/page.schema.json.

name = "liquidware-ninja"
title = "Liquidware knowledge base (liquidware-ninja)"
tagline = "The Liquidware second brain: a living knowledge base of findings, architecture, API notes, SpotCheck thresholds, gotchas and decisions for running Liquidware products (Stratusphere UX, ProfileUnity, FlexApp and CommandCTRL) across virtual and physical desktops, including Azure Virtual Desktop and FSLogix. Shared by a family of sibling knowledge bases that use the 2ndbrain format."
user_agent = "liquidware-ninja-kb-curator"
topic_order = [
  "overview",
  "liquidware",
  "stratusphere",
  "profileunity",
  "flexapp",
  "commandctrl",
  "platforms",
  "avd",
  "azure",
  "deployment",
  "troubleshooting",
  "roadmap",
  "curation"
]

# Decision 0011: what the Stop hook does when code changed without a KB entry ("block", "warn" or
# "off"). The kb-capture PR check runs either way. capture_ignore lists more paths that aren't code.
# Warn mode for the pilot (decision 0014).
capture_hook = "warn"
capture_ignore = []

# Decision 0016: a PR whose every changed file is in auto_merge_paths, and none in
# the fixed deny list in scripts/kb/auto_merge.py, merges itself on green through the kb-auto-merge
# workflow. Off until the owner has set up the repo; its own PR turns it on.
auto_merge = "off"
auto_merge_paths = ["docs/knowledge/**", "llms.txt"]

# Structured data files listed in llms.txt, in order. A file that doesn't exist is skipped.
[[data]]
name = "Known errors"
path = "troubleshooting/known-errors.yaml"
text = "symptom, cause, fix and source for errors hit with Liquidware products"

[[data]]
name = "Field reports"
path = "field-reports.yaml"
text = "what worked or broke when someone followed the KB"

[[data]]
name = "Experts study"
path = "experts.yaml"
text = "people the KB follows, with scores, evidence and the feeds watched"

[[data]]
name = "Family"
path = "family.yaml"
text = "the sibling knowledge bases and the format version each follows"
